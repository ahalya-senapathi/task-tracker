<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- React, ReactDOM and Babel (lets the browser understand JSX) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect } = React
      const FILTERS = ['All', 'Active', 'Done']

      function App() {
        // Load saved tasks once, on first render
        const [tasks, setTasks] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem('tasks')) || []
          } catch {
            return []
          }
        })
        const [text, setText] = useState('')
        const [filter, setFilter] = useState('All')

        // Save whenever tasks change
        useEffect(() => {
          localStorage.setItem('tasks', JSON.stringify(tasks))
        }, [tasks])

        function addTask(e) {
          e.preventDefault()
          const title = text.trim()
          if (!title) return
          setTasks([{ id: Date.now(), title, done: false }, ...tasks])
          setText('')
        }

        const toggle = (id) =>
          setTasks(tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t)))
        const remove = (id) => setTasks(tasks.filter((t) => t.id !== id))
        const clearDone = () => setTasks(tasks.filter((t) => !t.done))

        const visible = tasks.filter(
          (t) => filter === 'All' || (filter === 'Done' ? t.done : !t.done)
        )
        const left = tasks.filter((t) => !t.done).length

        return (
          <main className="app">
            <h1>Today's tasks</h1>
            <p className="sub">{left} left to do</p>

            <form onSubmit={addTask} className="add">
              <input
                value={text}
                onChange={(e) => setText(e.target.value)}
                placeholder="What needs doing?"
                aria-label="New task"
              />
              <button type="submit">Add task</button>
            </form>

            <div className="filters" role="group" aria-label="Filter tasks">
              {FILTERS.map((f) => (
                <button
                  key={f}
                  className={f === filter ? 'on' : ''}
                  onClick={() => setFilter(f)}
                >
                  {f}
                </button>
              ))}
            </div>

            {visible.length === 0 ? (
              <p className="empty">Nothing here yet. Add a task above to get started.</p>
            ) : (
              <ul>
                {visible.map((t) => (
                  <li key={t.id} className={t.done ? 'done' : ''}>
                    <label>
                      <input
                        type="checkbox"
                        checked={t.done}
                        onChange={() => toggle(t.id)}
                      />
                      <span>{t.title}</span>
                    </label>
                    <button
                      className="del"
                      onClick={() => remove(t.id)}
                      aria-label={'Delete ' + t.title}
                    >
                      Delete
                    </button>
                  </li>
                ))}
              </ul>
            )}

            {tasks.some((t) => t.done) && (
              <button className="clear" onClick={clearDone}>
                Clear finished tasks
              </button>
            )}
          </main>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
